name: Database Runtime Integration

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/**"
      - "tests/database-runtime-audit.ts"
      - "tests/database-runtime-audit.sql"
      - "tests/prepare-database-runtime.mjs"
      - ".github/workflows/database-runtime-integration.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-runtime:
    name: Database Runtime Integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Repository does not track package-lock.json; npm ci/cache require a committed lockfile.
      - run: npm install --no-audit --no-fund

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Inspect zero-cost runtime
        run: |
          docker --version
          docker compose version
          supabase --version

      - name: Create ephemeral local config
        run: |
          test ! -f supabase/config.toml
          supabase init
          runtime_workdir="$(node tests/prepare-database-runtime.mjs)"
          echo "RUNTIME_WORKDIR=${runtime_workdir}" >> "$GITHUB_ENV"
          echo "Generated local-only config:"
          sed -n '1,220p' "${runtime_workdir}/supabase/config.toml"

      - name: Start disposable local Supabase
        shell: bash
        run: |
          set -o pipefail
          if ! supabase start --workdir "$RUNTIME_WORKDIR" 2>&1 | tee /tmp/supabase-start.log; then
            echo "::group::Supabase startup diagnostics"
            docker ps -a || true
            docker compose ls || true
            docker logs supabase_db_minishop 2>&1 || true
            echo "::endgroup::"
            exit 1
          fi

      - name: Replay full migration chain through current task
        run: supabase db reset --workdir "$RUNTIME_WORKDIR"

      - name: Assert stale MCP rate-limit cleanup uses its timestamp index
        shell: bash
        run: |
          set -o pipefail
          docker exec -i supabase_db_minishop psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          insert into auth.users (
            instance_id, id, aud, role, email, encrypted_password,
            email_confirmed_at, raw_app_meta_data, raw_user_meta_data,
            created_at, updated_at
          ) values (
            '00000000-0000-0000-0000-000000000000',
            '10000000-0000-0000-0000-000000000037',
            'authenticated', 'authenticated', 'mcp-rate-limit-plan@example.test',
            crypt('local-runtime-only', gen_salt('bf')), now(),
            '{"provider":"email","providers":["email"]}'::jsonb, '{}'::jsonb,
            now(), now()
          );

          insert into private.mcp_rate_limits (user_id, action, requested_at)
          select
            '10000000-0000-0000-0000-000000000037'::uuid,
            'list_products',
            now() - interval '2 days' - (n * interval '1 second')
          from generate_series(1, 10000) as n;

          analyze private.mcp_rate_limits;
          explain (costs off)
          select id
          from private.mcp_rate_limits
          where requested_at < now() - interval '1 day'
          order by requested_at asc
          limit 500;
          SQL
          docker exec supabase_db_minishop psql -U postgres -d postgres -Atqc "
            explain (costs off)
            select id
            from private.mcp_rate_limits
            where requested_at < now() - interval '1 day'
            order by requested_at asc
            limit 500;
          " | grep -F 'Index Scan using mcp_rate_limits_requested_at_idx'

      - name: Inspect Storage RLS runtime state
        run: |
          docker exec supabase_db_minishop psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "select policyname, permissive, roles, cmd, qual, with_check from pg_policies where schemaname='storage' and tablename='objects' order by policyname;"
          docker exec supabase_db_minishop psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "select id,name,public,file_size_limit,allowed_mime_types from storage.buckets order by id;"

      - name: Run behavioral database audit
        shell: bash
        run: |
          supabase status --workdir "$RUNTIME_WORKDIR" -o env > /tmp/supabase-local.env
          set -a
          source /tmp/supabase-local.env
          set +a
          export SUPABASE_URL="${API_URL:-http://127.0.0.1:54321}"
          export SUPABASE_ANON_KEY="${ANON_KEY}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY}"
          npm run test:database-runtime

      - name: Assert no hosted Supabase credentials or URLs in runtime infrastructure
        if: always()
        run: |
          ! grep -R -n -E 'https://[a-z0-9-]+\.supabase\.co|db\.[a-z0-9-]+\.supabase\.co|eyJ[a-zA-Z0-9_-]{20,}\.' \
            .github/workflows/database-runtime-integration.yml tests/database-runtime-audit.ts tests/prepare-database-runtime.mjs

      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --workdir "$RUNTIME_WORKDIR" --no-backup || true
